name: Windows checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Runtime and recovery tests
        run: node --test
      - name: Windows setup checks
        shell: powershell
        run: .\scripts\Test-Scripts.ps1 -PrivateDirectoryAcl
      - name: PowerShell 7 setup checks
        shell: pwsh
        run: .\scripts\Test-Scripts.ps1 -PrivateDirectoryAcl
